# yaml-language-server: $schema=../schemas/game.schema.json

name: Sokoban
engine: godot
engine_version: "4.x"
genre: puzzle
dimension: 2D

gameplay:
  movement: grid_based
  mechanics:
    - push_boxes
    - walls
    - goals
    - undo
    - restart

levels:
  format: json
  directory: levels/
  generator: sokoban
  validation:
    - schema
    - solvability
    - deadlock_detection
    - duplicate_detection

quality:
  require_tests: true
  require_review: true
  protect_existing_levels: true
